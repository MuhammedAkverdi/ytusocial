<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeni Şifre Belirle - YTÜ Portal</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="auth-body">

    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }
    </script>

    <div class="auth-card">
        <a href="/" class="auth-logo">YTU<span>SOCIAL</span></a>
        
        <div class="auth-header">
            <h2 class="auth-title">Yeni Şifreni Oluştur</h2>
            <p class="auth-subtitle">{{ email }} adresine gönderilen kodu ve yeni şifreni gir.</p>
        </div>

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label class="form-label">Doğrulama Kodu</label>
                <input type="text" name="kod" placeholder="6 haneli kod" required 
                       class="auth-input" maxlength="6">
            </div>

            <div class="form-group">
                <label class="form-label">Yeni Şifre</label>
                <input type="password" name="password" placeholder="Yeni şifren" required 
                       class="auth-input" autocomplete="new-password">
            </div>

            <button type="submit" class="btn-vote" style="width: 100%; margin-top: 20px;">
                Şifreyi Güncelle
            </button>
        </form>

        <div class="auth-footer-link">
            <p style="margin: 0;">
                Kodu almadın mı?
                <a href="{{ url_for('auth.forgot_password') }}" class="link-highlight">Tekrar gönder</a>.
            </p>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
