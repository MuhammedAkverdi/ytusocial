<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hikaye • YTU Social</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a; /* Instagram koyu gri/siyah tonu */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        .story-viewer-container {
            position: relative;
            width: 100%;
            max-width: 400px; /* Mobil hikaye boyutu */
            height: 100vh;
            max-height: 850px;
            background: black;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* Medya (Resim/Video) */
        .story-media {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Resmi kesmeden sığdır */
            display: block;
        }

        /* Üst Bilgi (Kullanıcı) */
        .story-header {
            position: absolute;
            top: 20px;
            left: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
            width: 90%;
        }

        .user-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 2px solid white;
            object-fit: cover;
        }

        .user-info {
            display: flex;
            flex-direction: column;
        }

        .username {
            color: white;
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .timestamp {
            color: rgba(255,255,255,0.7);
            font-size: 0.75rem;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        /* Kapatma Butonu */
        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 1.5rem;
            text-decoration: none;
            z-index: 20;
            cursor: pointer;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.8));
        }

        /* Mobil Uyum */
        @media (max-width: 500px) {
            .story-viewer-container {
                max-width: 100%;
                border-radius: 0;
                height: 100vh;
                max-height: none;
            }
        }
    </style>
</head>
<body>

    <a href="/" style="position: absolute; top: 20px; left: 20px; color: white; text-decoration: none; font-weight: 800; font-size: 1.5rem; z-index: 5;">
        YTU<span style="color: #ffc107;">SOCIAL</span>
    </a>

    <a href="/" class="close-btn"><i class="fas fa-times"></i></a>

    <div class="story-viewer-container">
        
        <div class="story-header">
            <img src="/static/{{ story.author.profile_pic }}" class="user-avatar" onerror="this.src='/static/img/default_avatar.png'">
            <div class="user-info">
                <a href="{{ url_for('main.user_profile', handle=story.author.handle) }}" class="username">{{ story.author.username }}</a>
                <span class="timestamp">{{ story.timestamp.strftime('%H:%M') }}</span>
            </div>
        </div>

        {% if story.image_file.lower().endswith(('.mp4', '.mov', '.avi', '.webm')) %}
            <video src="/static/story_images/{{ story.image_file }}" class="story-media" autoplay playsinline controls></video>
        {% else %}
            <img src="/static/story_images/{{ story.image_file }}" class="story-media">
        {% endif %}

    </div>

</body>
</html>
