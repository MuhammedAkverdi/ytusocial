<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şifre Sıfırlama - YTÜ Portal</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="auth-body">

    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }
    </script>

    <div class="auth-card">
        <a href="/" class="auth-logo">YTU<span>SOCIAL</span></a>
        
        <div class="auth-header">
            <h2 class="auth-title">Şifreni Sıfırla</h2>
            <p class="auth-subtitle">Kayıtlı YTÜ e-postanı gir, sana 90 saniye geçerli bir kod gönderelim.</p>
        </div>

        <form method="POST" data-disable-double-submit="true">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label class="form-label">YTÜ E-posta</label>
                <input type="email" name="email" placeholder="isim@std.yildiz.edu.tr" required 
                       class="auth-input" autocomplete="email" autofocus>
            </div>

            <button type="submit" class="btn-vote" style="width: 100%; margin-top: 20px;">
                Kod Gönder
            </button>
        </form>

        <div class="auth-footer-link">
            <p style="margin: 0;">
                Giriş sayfasına dönmek için
                <a href="{{ url_for('auth.login') }}" class="link-highlight">tıkla</a>.
            </p>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
